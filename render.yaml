# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zerotodo
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server/server.js
    healthCheckPath: /api/config
    envVars:
      - key: ZT_TOKEN
        generateValue: true          # Render generates a secret; find it under the service's Environment tab
      - key: NODE_VERSION
        value: "20"
      - key: ZT_DATA_DIR
        value: /var/data/zerotodo    # must live on the disk path below, not in the repo dir
    disk:
      name: zerotodo-data            # 1 GB = the free-plan allowance
      mountPath: /var/data
      sizeGB: 1
