# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zerotodo
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server/server.js
    healthCheckPath: /api/config
    envVars:
      - key: ZT_TOKEN
        generateValue: true          # Render generates the passkey; see service → Environment after deploy
      - key: NODE_VERSION
        value: "20"
      # The free plan has NO persistent disk, so the durable copy lives in a
      # free Supabase Postgres row (setup: README-ONLINE.md → "Persistence
      # without a disk"). sync:false = you type the secret in, Render stores
      # it privately. Without these vars the server still runs, but data only
      # lives on an ephemeral filesystem — do NOT skip them on the free plan.
      - key: ZT_SUPABASE_URL
        sync: false
      - key: ZT_SUPABASE_KEY
        sync: false
